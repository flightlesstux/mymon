[project]
name = "mymon-collector"
version = "0.1.0"
description = "Polls public data APIs and stores rows in PostgreSQL for the mymon Grafana dashboards."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mymon_collector*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
