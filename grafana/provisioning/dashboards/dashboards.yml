apiVersion: 1

providers:
  - name: mymon
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      # Subdirectories under grafana/dashboards/ become Grafana folders (e.g. NL/*.json
      # -> folder "NL"); files directly in grafana/dashboards/ stay in the root.
      foldersFromFilesStructure: true
